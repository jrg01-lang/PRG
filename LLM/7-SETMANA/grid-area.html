<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto;
            height: 50vh;
            gap: 0;
            grid-template-areas: 
            "Header Header Header"
            "aside section1 section1"
            "aside section2 section2"
            "oferta publicidad1 Registronewsletter";
            .header{
                grid-area: Header;
            }
            .aside{
                grid-area: aside;
            }
            .section1{
                grid-area: section1;
            }
            .section2{
                grid-area: section2;
            }
            .oferta{
                grid-area: oferta;
            }
            .publicidad1{
                grid-area: publicidad1;
            }
            .Registronewsletter{
                grid-area: Registronewsletter;
            }
            section, article, .aside{
                background-color: beige;
                border:1px solid black;     
                display: flex;
                justify-content: center;
                align-items: center;  
            }
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <section class="header">
            Header
        </section>
        <aside class="aside">
            aside
        </aside>
        <section class="section1">
            section 1
        </section>
        <section class="section2">
            section 2
        </section>
        <section class="oferta">
            oferta
        </section>
        <section class="publicidad1">
            publicidad 1
        </section>
        <section class="Registronewsletter">
            Registro newsletter
        </section>
    </div>
</body>
</html>
