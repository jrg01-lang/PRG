<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto;
            height: 50vh;
            gap: 0;
            grid-template-areas: 
            "oferta oferta oferta"
            "art-1 art-2 art-3";
            .oferta{
                grid-area: oferta;
            }
            .art-1{
                grid-area: art-1;
            }
            .art-2{
                grid-area: art-2;
            }
            .art-3{
                grid-area: art-3;
            }
            section, article{ 
                background-color: beige;
                border:1px solid black;     
                display: flex;
                justify-content: center;
                align-items: center;               
            }
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <section class="oferta">
            Oferta principal
        </section>
        <article class="art-1">articulo 1</article>
        <article class="art-2">articulo 2</article>
        <article class="art-3">articulo 3</article>
    </div>
</body>
</html>
