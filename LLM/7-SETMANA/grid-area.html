<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr 1fr;
            height: 95vh;
            gap: 0;
            grid-template-areas: 
            "Header Header Header Header"
            "bloque1 bloque1 bloque1 aside"
            "bloque1 bloque1 bloque1 aside"
            "bloque1 bloque1 bloque1 aside"
            "Publicidad1 Publicidad1 registro registro";
            .header{
                grid-area: Header;
            }
            .aside{
                grid-area: aside;
            }
            .section1{
                grid-area: bloque1;
            }
            
            .publicidad1{
                grid-area: Publicidad1;
            }
            .Registronewsletter{
                grid-area: registro;
            }
            section, article, .aside{
                background-color: beige;
                border:1px solid black;     
                display: flex;
                justify-content: center;
                align-items: center;  
            }
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <section class="header">
            Header
        </section>
        <aside class="aside">
            aside
        </aside>
        <section class="section1">
            section 1
        </section>
        <section class="publicidad1">
            publicidad 1
        </section>
        <section class="Registronewsletter">
            Registro newsletter
        </section>
    </div>
</body>
</html>
