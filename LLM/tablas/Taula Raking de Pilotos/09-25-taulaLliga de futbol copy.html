<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lliga de Futbol</title>
  <style>
    * {
      color: rgb(0, 0, 0);
      
    }
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #ffffff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #ffffff;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #ffffff;
      text-align: left;
    }
    th {
      background-color: #edecf1;
    }
    tr:hover {
      background-color: #ffffff;
    }
    caption {
      font-size: 1.5em;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .AtributosPuntuaje {
      font-size: 20px;
      font-weight: bold;
      color: rgb(255, 255, 255);
      text-align: center;
      background-color: black;
    }
    .AtributosDelasCarreras {
      text-align: center;
      background-color: #2c2c2c;
      width: 200px; height: 100px;
      padding: 0px;
    }
    .ranking-number {
      width: 140px;
      height: 140px;
      background-color: #2c2c2c; 
      color: white;
      font-size: 2em;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(20% 0%, 100% 0%, 80% 100%, 0% 100%);
      box-shadow: 0 8px 10px rgba(0,0,0,0.4);

    }

    .container {
      display: flex;
      gap: 0px;
    }
    /* Debugging outline transform: rotate(-90deg);  writing-mode: vertical-rl;
    * {
    outline: 1px solid red;
    }*/
  </style>
</head>
<body>
  <table style="width: 100%; border-collapse: collapse; text-align: center;">
    <caption style="font-size: 40px; background-color: rgb(255, 166, 0); color: red">Clasificación Pilotos F1 2021</caption>
    <thead>
      <tr>
        <th colspan="2" style="text-align: start; font-size: 30px; color: rgb(107, 99, 99); ">
          <img src="/LLM/Folder Images/Activitat 1.1 - Taules/Ex. 3-Carreres F1/img/bg-title-pilot.png" alt="" style="vertical-align: middle; margin-right: 350px;">
          <span>Piloto</span>
        </th>
        <th colspan="1" style="text-align: center; font-size: 30px; color: rgb(255, 255, 255); writing-mode: vertical-rl; transform: rotate(180deg); background-color: white; color: black;">PUNTOS</th>

        <th rowspan="1" class="AtributosDelasCarreras">
          <div style="width: 100%; height: 50%; background: rgb(56, 54, 54); display:flex; justify-content:center; align-items:center; border-bottom: 5px solid rgb(160, 159, 159);">
            <img src="/LLM/Folder Images/Activitat 1.1 - Taules/Ex. 3-Carreres F1/img/circuits/c_1.png" alt="">
            
          </div>
          <div style="width: 100%; height: 49%; background:gray; display:flex; justify-content:center; align-items:center;">
            <div style="display: flex; flex-direction: column; gap: 10px;">
              <span style="font-size: 24px; font-weight: bold; color: rgb(255, 255, 255);">BHR</span>
              <img src="/LLM/Folder Images/Activitat 1.1 - Taules/Ex. 3-Carreres F1/img/flats/bahrain_flag_48.png" alt="Imagen">
            </div>
            
          </div>
        </th>
        <th colspan="1" style="text-align: center; font-size: 30px; color: rgb(107, 99, 99);">PG</th>
        <th colspan="1" style="text-align: center; font-size: 30px; color: rgb(107, 99, 99);">PE</th>
        <th colspan="1" style="text-align: center; font-size: 30px; color: rgb(107, 99, 99);">PP</th>
        <th colspan="1" style="text-align: center; font-size: 30px; color: rgb(107, 99, 99);">GF</th>
        <th colspan="1" style="text-align: center; font-size: 30px; color: rgb(107, 99, 99);">GC</th>
        
      </tr>
    </thead> 
    <tbody>
      <tr>
        <td><div class="container">
          <div class="ranking-number">1º</div>
        </div>
        </td>
        <td>
        <div style="display: flex; align-items: center; gap: 10px; justify-content: center;">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <span style="font-size: 14px; font-weight: bold; color: rgb(0, 38, 255);">Lewis Hamilton</span>
            <img src="/LLM/Folder Images/Activitat 1.1 - Taules/Ex. 3-Carreres F1/img/cars/mercedes.png" alt="Imagen">
          </div>
          <span style="font-size: 15px; font-weight: bold; color: rgb(253, 122, 0);">(mercedes)</span>
          <img src="/LLM/Folder Images/Activitat 1.1 - Taules/Ex. 3-Carreres F1/img/pilots/lewis-hamilton.png" alt="Imagen">
        </div>
        
      </td>
      <td class="AtributosPuntuaje">195</td>
      <td class="AtributosAFD">25</td>
      <td class="AtributosAFD">9</td>
      <td class="AtributosAFD">4</td>
      <td class="AtributosAFD">67</td>
      <td class="AtributosAFD">28</td>
      </tr>
      
    </tbody>
  </table>
</body>
</html>
