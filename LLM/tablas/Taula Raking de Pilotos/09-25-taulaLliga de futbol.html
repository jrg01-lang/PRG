<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ranking F1</title>
  <style>
    .ranking-number {
      width: 140px;
      height: 140px;
      background-color: #2c2c2c; /* Color oscuro como en la imagen */
      color: white;
      font-size: 2em;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(20% 0%, 100% 0%, 80% 100%, 0% 100%);
      box-shadow: 0 8px 10px rgba(0,0,0,0.4);

    }

    .container {
      display: flex;
      gap: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="ranking-number">1º</div>
    <div class="ranking-number">2º</div>
    <div class="ranking-number">3º</div>
  </div>
</body>
</html>
